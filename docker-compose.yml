version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: prisma_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    image: gormahia:v2
    # build: .
    container_name: kogalo2
    restart: always
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    env_file:
      - .env
    # volumes:
    #   - .:/app
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run dev"

volumes:
  postgres_data:
